
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI YOUTUBER</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

button {
  cursor: pointer;
  font-family: inherit;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 7%;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
}

.logo span {
  color: #ff3030;
}

.login-btn {
  background: transparent;
  color: white;
  border: 1px solid #ff3030;
  border-radius: 7px;
  padding: 12px 23px;
}

.hero {
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
}

.avatar {
  width: 125px;
  height: 125px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff3030, #350000);
  border: 3px solid #ff3030;
  box-shadow: 0 0 45px #ff303055;
  font-size: 40px;
  font-weight: bold;
  margin-bottom: 35px;
}

.tagline {
  color: #ff4545;
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 22px;
}

h1 {
  font-size: clamp(38px, 7vw, 68px);
  line-height: 1.15;
}

h1 span {
  color: #ff3030;
}

.description {
  max-width: 530px;
  color: #aaa;
  line-height: 1.8;
  margin: 25px 0 30px;
}

.buttons {
  display: flex;
  gap: 15px;
}

.primary-btn {
  background: #ff3030;
  color: white;
  border: none;
  border-radius: 7px;
  padding: 16px 30px;
  font-weight: bold;
}

.secondary-btn {
  background: transparent;
  color: white;
  border: 1px solid #555;
  border-radius: 7px;
  padding: 16px 30px;
}

.note {
  color: #777;
  margin-top: 35px;
  font-size: 12px;
}

.footer {
  text-align: center;
  padding: 25px;
  color: #666;
  font-size: 12px;
}

@media (max-width: 500px) {
  .navbar {
    padding: 20px;
  }

  .logo {
    font-size: 17px;
  }

  .buttons {
    flex-direction: column;
    width: 100%;
    max-width: 260px;
  }
}
</style>
</head>

<body>

<header class="navbar">
  <div class="logo">AI <span>YOUTUBER</span></div>
  <button class="login-btn" onclick="showLogin()">
    Log in
  </button>
</header>

<main class="hero">

  <div class="avatar">AI</div>

  <p class="tagline">
    YOUR CHANNEL. YOUR AI CREATOR.
  </p>

  <h1>
    Your YouTube channel,<br>
    <span>powered by AI.</span>
  </h1>

  <p class="description">
    Research, create, publish and improve.
    Let your AI creator manage your entire
    content journey while you stay in control.
  </p>

  <div class="buttons">
    <button class="primary-btn" onclick="showSignup()">
      Get Started
    </button>

    <button class="secondary-btn" onclick="learnMore()">
      Discover More
    </button>
  </div>

  <p class="note">
    Your channel. Your AI. Your control.
  </p>

</main>

<footer class="footer">
  © 2026 AI YOUTUBER
</footer>

<script>
function showSignup() {
  alert("Our sign-up page is coming soon!");
}

function showLogin() {
  alert("Our login page is coming soon!");
}

function learnMore() {
  alert("AI YOUTUBER will research, create, publish and improve your videos.");
}
</script>

</body>
</html>
